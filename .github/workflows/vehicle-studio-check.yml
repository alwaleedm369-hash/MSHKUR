name: Vehicle Studio Production Gate

on:
  push:
    branches:
      - rebuild/product-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vehicle-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild native modules and prepare ONNX assets
        run: |
          npm rebuild better-sqlite3 sharp --no-audit --no-fund
          node scripts/copy-onnx-wasm.mjs
      - name: Run tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
