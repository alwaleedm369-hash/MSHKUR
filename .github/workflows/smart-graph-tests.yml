name: Smart Graph Runtime Tests

on:
  push:
    branches:
      - feat/smart-graph-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smart-graph-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild native modules and prepare ONNX assets
        run: |
          npm rebuild better-sqlite3 sharp --no-audit --no-fund
          node scripts/copy-onnx-wasm.mjs
      - name: Run Smart Graph repository tests
        run: node --test tests/smart-graph.test.mjs tests/smart-graph-sqlite.test.mjs
