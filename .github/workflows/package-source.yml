name: package-source
on:
  push:
    branches: ["build/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create clean source archive
        run: |
          mkdir -p dist
          zip -r dist/MSHKUR-source.zip . \
            -x ".git/*" "node_modules/*" "dist/*" \
               ".env" ".env.*" "data/*" "storage/*" \
               "coverage/*" "*.log" ".DS_Store"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MSHKUR-source
          path: dist/MSHKUR-source.zip
          if-no-files-found: error
          retention-days: 14
